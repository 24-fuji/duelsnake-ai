# web/ をビルドして GitHub Pages に公開する
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "model/recent-model/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 配信元が「Deploy from a branch」のままだと、ここでデプロイしても README のページで上書きされる
      - name: Check Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo "disabled")
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages の配信元が GitHub Actions ではありません (現在: $build_type)。Settings → Pages → Build and deployment → Source を「GitHub Actions」にしてから、このワークフローを再実行してください。"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v5
