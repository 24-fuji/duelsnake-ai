[package]
name = "duelsnake-learn"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
sysinfo = "0.30"
num_cpus = "1.16"
ctrlc = "3.4"
tch = { version = "0.14", features = ["download-libtorch"] } # PyTorch (libtorch) Rustバインディング
chrono = "0.4"