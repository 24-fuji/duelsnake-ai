[package]
name = "duelsnake-learn"
version = "0.2.0"
edition = "2021"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
serde_yaml = "0.9"
tch = { version = "0.14", features = ["download-libtorch"] } # PyTorch (libtorch) Rustバインディング
