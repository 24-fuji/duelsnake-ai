# DuelSnake-AI 学習設定
# ルールの詳細は RULES.md を参照。

# --- ゲームルール ---
# Web 版と共通のパラメータ。学習済みモデルの JSON にもそのまま書き出される。
game:
  grid:
    width: 8
    height: 8
    tick_seconds: 0.1 # 1ティックの長さ。以下の秒数はすべてティック数に丸めて扱う
    time_limit_seconds: 30.0

  snake:
    initial_length: 3
    normal_speed_interval_sec: 0.2
    boost_speed_interval_sec: 0.1
    boost_duration_sec: 5.0
    boost_cooldown_sec: 7.5 # ブースト終了後から数える

  items:
    apple_respawn_delay_sec: 0.6 # 普通のリンゴ・毒リンゴ
    special_respawn_delay_sec: 1.0 # 金のリンゴ・ブロック消去・お邪魔
    jam_block_delay_sec: 0.2 # お邪魔を使ってから相手フィールドにブロックが出るまで
    jam_block_safe_distance: 2 # 相手の頭からこのマンハッタン距離以内にはブロックを出さない
    max_apples: 3 # 普通のリンゴの個数
    max_poison: 2 # 毒リンゴの個数
    normal_apple_score: 1
    gold_apple_score: 3
    poison_apple_score: -1
    normal_apple_grow: 1
    gold_apple_grow: 3
    poison_apple_grow: -2

# --- ネットワーク構造 ---
# 盤面 → 畳み込み (3x3, padding 1, ReLU) → 平坦化 + 状態ベクトル → 全結合 (ReLU) → 行動ごとの Q 値
# 盤面サイズごとの構造は下の board_sizes に書く。ここは board_sizes に無い盤面サイズで使う。
# 層を変えたモデルからは再開できないので、変えたら just train で新しく学習する
model:
  conv_layers:
    - { channels: 32, stride: 1 }
    - { channels: 32, stride: 2 }
    - { channels: 64, stride: 2 }
  hidden_layers: [256]

# --- 盤面サイズごとの設定 ---
# game.grid と同じサイズ (幅x高さ) のものがあれば、model と train.replay_capacity をこれで差し替える。書かなかった項目は上の値を使う。
# 衝突を避けるには頭の周りの細かい位置が要るので、なるべく元の解像度のまま畳み込む層を残す
# (8x8 で stride 2 を 2 回通すと 2x2 まで縮み、どのマスが空いているかが失われやすい)。
# GPU が無く CPU で学習するので、広い盤面ほど早めに縮めて、1 回の推論の計算量 (10x10 以上は約 230 万回の積和) をそろえる。
# リプレイは 1 遷移あたり 2 × (17 × マス数 + 88) バイトほどで、どの盤面も 1GB 弱に収める
board_sizes:
  8x8:
    model:
      conv_layers:
        - { channels: 32, stride: 1 } # 8x8
        - { channels: 32, stride: 1 } # 8x8
        - { channels: 64, stride: 2 } # 4x4
      hidden_layers: [256]
    replay_capacity: 400000 # 約 2.4KB × 400000 = 約 950MB
  10x10:
    model:
      conv_layers:
        - { channels: 32, stride: 1 } # 10x10
        - { channels: 32, stride: 1 } # 10x10
        - { channels: 64, stride: 2 } # 5x5
      hidden_layers: [256]
    replay_capacity: 250000 # 約 3.6KB × 250000 = 約 900MB
  12x12:
    model:
      conv_layers:
        - { channels: 32, stride: 1 } # 12x12
        - { channels: 32, stride: 2 } # 6x6
        - { channels: 64, stride: 1 } # 6x6
      hidden_layers: [256]
    replay_capacity: 200000 # 約 5.1KB × 200000 = 約 1.0GB
  16x16:
    model:
      conv_layers:
        - { channels: 32, stride: 1 } # 16x16
        - { channels: 32, stride: 2 } # 8x8
        - { channels: 64, stride: 2 } # 4x4
      hidden_layers: [256]
    replay_capacity: 110000 # 約 8.9KB × 110000 = 約 980MB

# --- 報酬 ---
reward:
  win: 50.0
  lose: -50.0
  draw: 0.0

  # 衝突して死んだときの追加の罰。その試合でアイテムから得た報酬の合計 × score_ratio を引く。
  # lose が一定だと、たくさん稼いだあとなら死んでも収支がプラスになり、盤面が埋まる終盤に無理をして死ぬ動きが出る。
  # ただし最初から重くすると稼ぎが消えて学習が進まないので、ramp_decisions 回の判断をかけて 0 から上げていく (0 なら最初から全力)
  death_penalty:
    score_ratio: 0.5 # 1 なら稼ぎをすべて打ち消す
    ramp_decisions: 1000000

  # アイテムを取ったときの報酬。スコアの増減と同じ大きさにして、勝ち負け (±50) より小さく抑える。
  # 大きくすると、勝つことより伸びることを優先し、8x8 の盤面で長くなりすぎて衝突する動きになる。
  # 毒リンゴはスコアが減るが短くなって生き残りやすくなるので、重い罰にはしない
  pickup:
    normal_apple: 1.0
    gold_apple: 3.0
    poison_apple: -1.0
    block_clear: 1.0 # ブロック消去
    block_jam: 1.0 # お邪魔

  # 引力・斥力による報酬の補助 (学習時だけ使い、ゲームのルールには影響しない)。
  # リンゴ・毒リンゴ・お邪魔ブロックから頭に力が働いているとみなし、頭が1マス動くたびに力がした仕事を報酬に足す。
  # 引力のリンゴに近づくと +、遠ざかると −。斥力の毒リンゴ・お邪魔ブロックはその逆。
  # 力は頭からのマンハッタン距離が range 以内のマスに出入りする移動にだけ働き、1マスごとに 強さ / (range + 1) ずつ。
  # range より遠くから近づいて取ると、合計でちょうど「強さ」の報酬になる。強さを 0 にするとその力は働かない
  force:
    attraction_range: 30 # 引力が届く距離。盤面の端から端 (幅 + 高さ − 2) 以上にすると盤面全体に届く
    repulsion_range: 1 # 斥力が届く距離。1 なら隣のマスに入るときと、そこから取る・離れるときだけ働く
    normal_apple_attraction: 0.2 # 普通のリンゴの引力の強さ
    gold_apple_attraction: 0.6 # 金のリンゴの引力の強さ
    poison_apple_repulsion: 0.1 # 毒リンゴの斥力の強さ
    jam_block_repulsion: 1.0 # お邪魔ブロックの斥力の強さ (ぶつかると頭は進まないので、隣に入るときの 強さ / 2 だけ引かれる)

# --- 学習 (自己対戦 Double DQN) ---
train:
  num_envs: 64 # 同時に進める対戦数。1対戦ごとに2匹分の経験が得られ、推論もまとめて行う
  learning_rate: 0.00025 # ネットワークを大きくしたので、学習を安定させるために下げる
  gamma: 0.99 # 1判断あたりの割引率
  n_step: 3
  batch_size: 128
  # board_sizes に無い盤面サイズで使う。盤面サイズごとの値は board_sizes の replay_capacity に書く。
  # 毎秒数千の遷移が入るので、小さいと直近の数十秒分しか残らず、同じ場面ばかり学習する
  replay_capacity: 200000
  learning_starts: 20000 # リプレイにこの数の遷移が溜まるまで学習しない
  transitions_per_update: 32 # 新しい遷移がこの数だけ溜まるごとに1回更新する
  target_update_interval: 1000 # ターゲットネットワークを同期する更新回数の間隔
  epsilon_start: 1.0
  # ランダム行動は衝突しやすく、0.05 では試合が序盤で終わってしまい、実際に負けが決まる長くなった終盤をほとんど学習できない
  epsilon_end: 0.01
  epsilon_decay_decisions: 2000000
  grad_clip_norm: 10.0
  log_interval_seconds: 30 # この秒数ごとに統計を log/train-*.log と .csv に書き出す
  save_interval_games: 10000
  # save_interval_games ごとにモデルを保存した直後、旧モデル (main のモデル) とこの試合数だけ対戦させ、勝率を記録する。
  # 結果は docs/training/winrate-<幅>x<高さ>.csv (git 管理外) に足し、同じ場所の .png のグラフを描き直す。0 なら対戦しない
  eval_games: 1000
  # --auto-commit を付けたとき (just train / just train-resume)、通算試合数がこの数の倍数を越えるごとに
  # 最新モデルを保存し、"model update" で git にコミットしてプッシュする
  commit_interval_games: 100000

# --- 書き出し ---
export:
  # Web 側で使う難易度。random_action_rate の確率で AI がランダムに行動する
  difficulty:
    - { name: easy, random_action_rate: 0.6 }
    - { name: medium, random_action_rate: 0.3 }
    - { name: hard, random_action_rate: 0.0 }
