# DuelSnake-AI 学習設定
# ルールの詳細は RULES.md を参照。

# --- ゲームルール ---
# Web 版と共通のパラメータ。学習済みモデルの JSON にもそのまま書き出される。
game:
  grid:
    width: 16
    height: 16
    tick_seconds: 0.1 # 1ティックの長さ。以下の秒数はすべてティック数に丸めて扱う
    time_limit_seconds: 30.0

  snake:
    initial_length: 3
    normal_speed_interval_sec: 0.2
    boost_speed_interval_sec: 0.1
    boost_duration_sec: 5.0
    boost_cooldown_sec: 7.5 # ブースト終了後から数える

  items:
    apple_respawn_delay_sec: 0.6 # 普通のリンゴ・毒リンゴ
    special_respawn_delay_sec: 1.0 # 金のリンゴ・ブロック消去・お邪魔
    jam_block_delay_sec: 0.2 # お邪魔を使ってから相手フィールドにブロックが出るまで
    jam_block_safe_distance: 2 # 相手の頭からこのマンハッタン距離以内にはブロックを出さない
    max_apples: 3 # 普通のリンゴの個数
    max_poison: 2 # 毒リンゴの個数
    normal_apple_score: 1
    gold_apple_score: 3
    poison_apple_score: -1
    normal_apple_grow: 1
    gold_apple_grow: 3
    poison_apple_grow: -2

# --- ネットワーク構造 ---
# 盤面 → 畳み込み (3x3, padding 1, ReLU) → 平坦化 + 状態ベクトル → 全結合 (ReLU) → 行動ごとの Q 値
model:
  conv_layers:
    - { channels: 16, stride: 1 } # 16x16
    - { channels: 32, stride: 2 } # 8x8
    - { channels: 64, stride: 2 } # 4x4
  hidden_layers: [128]

# --- 報酬 ---
reward:
  win: 1.0
  lose: -1.0
  draw: 0.0
  score_point: 0.1 # スコア1点の増減あたり

  # 引力・斥力による報酬の補助 (学習時だけ使い、ゲームのルールには影響しない)。
  # リンゴ・毒リンゴ・お邪魔ブロックから頭に力が働いているとみなし、頭が1マス動くたびに力がした仕事を報酬に足す。
  # 引力のリンゴに近づくと +、遠ざかると −。斥力の毒リンゴ・お邪魔ブロックはその逆。
  # 力は頭からのマンハッタン距離が range 以内のマスに出入りする移動にだけ働き、1マスごとに 強さ / (range + 1) ずつ。
  # range より遠くから近づいて取ると、合計でちょうど「強さ」の報酬になる。強さを 0 にするとその力は働かない
  force:
    attraction_range: 30 # 引力が届く距離。盤面の端から端 (幅 + 高さ − 2) 以上にすると盤面全体に届く
    repulsion_range: 1 # 斥力が届く距離。1 なら隣のマスに入るときと、そこから取る・離れるときだけ働く
    normal_apple_attraction: 0.2 # 普通のリンゴの引力の強さ
    gold_apple_attraction: 0.6 # 金のリンゴの引力の強さ
    poison_apple_repulsion: 0.1 # 毒リンゴの斥力の強さ
    jam_block_repulsion: 1.0 # お邪魔ブロックの斥力の強さ (ぶつかると頭は進まないので、隣に入るときの 強さ / 2 だけ引かれる)

# --- 学習 (自己対戦 Double DQN) ---
train:
  num_envs: 64 # 同時に進める対戦数。1対戦ごとに2匹分の経験が得られ、推論もまとめて行う
  learning_rate: 0.0005
  gamma: 0.99 # 1判断あたりの割引率
  n_step: 3
  batch_size: 128
  replay_capacity: 200000 # 1遷移あたり約 4.7KB (16x16 盤面で 200000 なら約 0.95GB)
  learning_starts: 10000 # リプレイにこの数の遷移が溜まるまで学習しない
  transitions_per_update: 32 # 新しい遷移がこの数だけ溜まるごとに1回更新する
  target_update_interval: 1000 # ターゲットネットワークを同期する更新回数の間隔
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_decisions: 1000000
  grad_clip_norm: 10.0
  log_interval_seconds: 30 # この秒数ごとに統計を log/train-*.log と .csv に書き出す
  save_interval_games: 10000

# --- 書き出し ---
export:
  # Web 側で使う難易度。random_action_rate の確率で AI がランダムに行動する
  difficulty:
    - { name: easy, random_action_rate: 0.6 }
    - { name: medium, random_action_rate: 0.3 }
    - { name: hard, random_action_rate: 0.0 }
